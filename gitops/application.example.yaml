apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-lab
  namespace: argocd
spec:
  # Pre-create a restricted AppProject. Do not grant arbitrary cluster destinations.
  project: platform-lab
  source:
    repoURL: https://github.com/REPLACE_ORG/REPLACE_GITOPS_REPO.git
    targetRevision: main
    path: charts/service
    helm:
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: service-lab
  # Enable auto-sync only after a successful manual lab deployment and rollback drill.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
