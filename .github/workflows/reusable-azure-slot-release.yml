name: 'Release: Azure App Service slot'
'on':
  workflow_call:
    inputs:
      toolkit_ref:
        description: Full reviewed 40-character commit SHA of this toolkit; use the same SHA as the workflow reference.
        required: true
        type: string
      artifact_name:
        description: Artifact from reusable-hybrid-build in the same workflow run.
        required: true
        type: string
      environment:
        description: Pre-created protected GitHub environment; configure required reviewers and branch restrictions.
        required: true
        type: string
      resource_group:
        description: Existing resource group.
        required: true
        type: string
      app_name:
        description: Existing Windows App Service name.
        required: true
        type: string
      slot:
        description: Existing non-production deployment slot.
        required: false
        type: string
        default: staging
      client_id:
        description: Entra application client ID with environment-scoped OIDC federation.
        required: true
        type: string
      tenant_id:
        description: Entra tenant ID.
        required: true
        type: string
      subscription_id:
        description: Azure subscription ID.
        required: true
        type: string
permissions: {}
jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    runs-on: windows-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: azure-${{ inputs.subscription_id }}-${{ inputs.app_name }}
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Validate toolkit pin
      shell: pwsh
      run: if ($env:TOOLKIT_REF -notmatch '^[a-f0-9]{40}$') { throw 'toolkit_ref must be a full commit SHA' }
      env:
        TOOLKIT_REF: ${{ inputs.toolkit_ref }}
    - name: Checkout reviewed toolkit scripts
      uses: actions/checkout@v7
      with:
        repository: iampopye/devops-workflows
        ref: ${{ inputs.toolkit_ref }}
        path: .toolkit
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: release
    - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        client-id: ${{ inputs.client_id }}
        tenant-id: ${{ inputs.tenant_id }}
        subscription-id: ${{ inputs.subscription_id }}
    - name: Deploy, warm, swap and verify
      shell: pwsh
      run: '& ./.toolkit/scripts/hybrid/Invoke-AzureRelease.ps1 -ReleaseDirectory ./release -ResourceGroup $env:RESOURCE_GROUP
        -AppName $env:APP_NAME -Slot $env:SLOT'
      env:
        RESOURCE_GROUP: ${{ inputs.resource_group }}
        APP_NAME: ${{ inputs.app_name }}
        SLOT: ${{ inputs.slot }}
