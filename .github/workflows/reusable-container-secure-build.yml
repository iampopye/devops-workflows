name: 'Container: build, scan, SBOM and publish'
'on':
  workflow_call:
    inputs:
      image_name:
        description: Lowercase GHCR image name, for example ghcr.io/owner/service.
        required: true
        type: string
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      dockerfile:
        description: Path to Dockerfile.
        required: false
        type: string
        default: Dockerfile
      push:
        description: Push scanned image from default branch only.
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: Published digest; empty for validation-only builds.
        value: ${{ jobs.build.outputs.digest }}
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Validate destination
      shell: bash
      env:
        IMAGE: ${{ inputs.image_name }}
      run: 'set -euo pipefail

        [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._/-]+$ ]]'
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        load: true
        push: false
        tags: ${{ inputs.image_name }}:sha-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Block vulnerable images before publishing
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image_name }}:sha-${{ github.sha }}
        severity: CRITICAL,HIGH
        ignore-unfixed: false
        exit-code: '1'
    - name: Generate SPDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image_name }}:sha-${{ github.sha }}
        format: spdx-json
        output: sbom.spdx.json
    - uses: actions/upload-artifact@v4
      with:
        name: sbom-${{ github.run_id }}-${{ github.run_attempt }}
        path: sbom.spdx.json
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: inputs.push && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref ==
        format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Push the scanned image without rebuilding
      id: publish
      if: inputs.push && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref ==
        format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        IMAGE: ${{ inputs.image_name }}
        SHA: ${{ github.sha }}
      run: 'set -euo pipefail

        docker push "$IMAGE:sha-$SHA"

        digest="$(docker image inspect "$IMAGE:sha-$SHA" --format ''{{index .RepoDigests 0}}'')"

        [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]

        echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"'
