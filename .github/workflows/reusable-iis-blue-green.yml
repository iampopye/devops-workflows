name: 'Release: IIS blue-green'
'on':
  workflow_call:
    inputs:
      toolkit_ref:
        description: Full reviewed 40-character commit SHA of this toolkit; use the same SHA as the workflow reference.
        required: true
        type: string
      artifact_name:
        description: Artifact from reusable-hybrid-build in the same workflow run.
        required: true
        type: string
      environment:
        description: Pre-created protected GitHub environment; configure required reviewers and branch restrictions.
        required: true
        type: string
      runner_labels:
        description: JSON runner labels for an isolated internal Windows runner.
        required: false
        type: string
        default: '["self-hosted", "Windows", "iis-deploy"]'
      inventory:
        description: Path to reviewed JSON inventory in caller repository.
        required: true
        type: string
      adapter:
        description: Path to reviewed load-balancer/server adapter PowerShell script in caller repository.
        required: true
        type: string
permissions: {}
jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: iis-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Validate toolkit pin
      shell: pwsh
      run: if ($env:TOOLKIT_REF -notmatch '^[a-f0-9]{40}$') { throw 'toolkit_ref must be a full commit SHA' }
      env:
        TOOLKIT_REF: ${{ inputs.toolkit_ref }}
    - name: Checkout reviewed toolkit scripts
      uses: actions/checkout@v7
      with:
        repository: iampopye/devops-workflows
        ref: ${{ inputs.toolkit_ref }}
        path: .toolkit
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: release
    - name: Verify artifact and orchestrate inactive colour
      shell: pwsh
      run: '& ./.toolkit/scripts/hybrid/Invoke-IisRelease.ps1 -ReleaseDirectory ./release -InventoryPath $env:INVENTORY -AdapterPath
        $env:ADAPTER'
      env:
        INVENTORY: ${{ inputs.inventory }}
        ADAPTER: ${{ inputs.adapter }}
