name: Platform reference validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  powershell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test artifact and release failure paths
        shell: pwsh
        run: |
          ./tests/Test-Hybrid.ps1
          ./tests/Test-AzureRelease.ps1
  helm:
    uses: ./.github/workflows/reusable-kubernetes-helm-validate.yml
    permissions:
      contents: read
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
      - run: terraform fmt -check -recursive terraform
      - name: Validate module without credentials or a backend
        working-directory: terraform/modules/azure-network
        run: |
          terraform init -backend=false -input=false
          terraform validate
  ansible:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools and pinned Windows collection
        run: |
          python -m pip install ansible-core==2.18.6 ansible-lint==25.5.0 pywinrm==0.5.0
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Validate playbook without contacting servers
        run: |
          ansible-playbook -i ansible/inventory.example.yml ansible/iis-baseline.yml --syntax-check
          ansible-lint ansible/iis-baseline.yml
